  <text x="78" y="555" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">Coding agents implement. Humans verify every diff.</text>

  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
