<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title description">
  <title id="title">AI-first rebuild lab</title>
  <desc id="description">レガシー業務システムをAIと一緒に作り直すプロジェクト</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c31"/>
      <stop offset="100%" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fcf8e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <g transform="translate(0 18)">
    <g fill="none" stroke="#3fcf8e" stroke-opacity="0.30" stroke-width="2">
      <path d="M986 130h92a18 18 0 0 1 18 18v116a18 18 0 0 1-18 18h-74"/>
      <path d="M970 282a18 18 0 0 1-18-18V148a18 18 0 0 1 18-18h12"/>
    </g>
    <path d="m1004 282 13-7v14z" fill="#3fcf8e" fill-opacity="0.55"/>
    <g fill="#0f172a" stroke="#3fcf8e" stroke-opacity="0.55" stroke-width="2">
      <circle cx="984" cy="130" r="8"/>
      <circle cx="1096" cy="206" r="8"/>
      <circle cx="986" cy="282" r="8"/>
      <circle cx="952" cy="206" r="8"/>
    </g>
    <circle cx="984" cy="130" r="3.5" fill="#3fcf8e" fill-opacity="0.9" stroke="none"/>
  </g>

  <rect x="76" y="88" width="60" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="76" y="184" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">AI-first rebuild lab</text>
  <text x="78" y="252" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif" font-size="31" font-weight="650" fill="#e2e8f0">レガシー業務システムを、AIと一緒に作り直す。</text>
  <text x="78" y="326" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif" font-size="23" font-weight="500" fill="#cbd5e1">設計を先に固め、判断を記録し、検証してから進める。</text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600">
    <g transform="translate(78 387)">
      <rect width="126" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="63" y="27" text-anchor="middle" fill="#e2e8f0">Next.js</text>
    </g>
    <g transform="translate(218 387)">
      <rect width="88" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="44" y="27" text-anchor="middle" fill="#e2e8f0">Rust</text>
    </g>
    <g transform="translate(320 387)">
      <rect width="142" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="71" y="27" text-anchor="middle" fill="#e2e8f0">Supabase</text>
