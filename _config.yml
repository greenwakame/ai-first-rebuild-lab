# GitHub Pages / Jekyll configuration
#
# Served from the `main` branch root so relative links resolve the same way on
# github.com and on the published site. Rendering relies only on the plugins
# GitHub Pages enables by default: no theme gem, no remote theme, no build step,
# no GitHub Actions workflow.
#
# Markdown files carry no front matter on purpose — `jekyll-optional-front-matter`
# renders them anyway, and `docs/reference/*.md` must stay verbatim copies of the
# development repository's originals. The layout is applied through `defaults`
# instead of being written into the documents.

title: AI-first rebuild lab
description: レガシー社内業務システムを Next.js・Rust・Supabase で作り直す取り組みの公開入口

url: https://greenwakame.github.io
baseurl: /ai-first-rebuild-lab

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
